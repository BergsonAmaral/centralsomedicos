<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F2F0EA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'DM Sans', 'Inter', sans-serif;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }
    img {
      height: 48px;
      width: auto;
      opacity: 0;
      animation: fade-in .5s ease .1s forwards;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid rgba(10,12,9,0.12);
      border-top-color: #2daa8a;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/logo.png" alt="Central SóMedicos">
    <div class="spinner"></div>
  </div>
</body>
</html>
